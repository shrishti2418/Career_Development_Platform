{% extends 'extractor/base.html' %}

{% block title %}Password Reset - AIcruit{% endblock %}

{% block content %}
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-6">
        <div class="card auth-form">
          <div class="card-header bg-primary text-white text-center">
            <h4><i class="fas fa-key"></i> Password Reset</h4>
          </div>
          <div class="card-body">
            <p>Forgot your password? Enter your email address below, and we'll send you a link to reset your password.</p>
            <form method="post">
              {% csrf_token %}
              <div class="mb-3">
                <label for="id_email" class="form-label">Email</label>
                <input type="email" name="email" id="id_email" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
