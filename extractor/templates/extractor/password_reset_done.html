{% extends 'extractor/base.html' %}

{% block title %}Password Reset Sent - AIcruit{% endblock %}

{% block content %}
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-6">
        <div class="card auth-form">
          <div class="card-header bg-primary text-white text-center">
            <h4>Password Reset Sent</h4>
          </div>
          <div class="card-body">
            <p>An email has been sent with instructions to reset your password. Please check your inbox.</p>
            <a href="{% url 'login' %}" class="btn btn-primary w-100">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
